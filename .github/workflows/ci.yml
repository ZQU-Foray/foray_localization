# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
# 本仓已按实际技术栈裁剪：只保留**真实执行**的作业。
#
# 作业集合：
#   dir-layout      目录与包命名规范
#   file-hygiene    文件卫生（LF / UTF-8 / 末尾单空行 / 无行尾空白）
#   doc-sync        tree.md 与实际跟踪文件双向一致
#   param-contract  README 参数表 ↔ declare_parameter ↔ 兵种配置三方一致
#   contract-lock   msg/srv/action 接口指纹快照
#   gate-selftest   门禁自检：注入已知缺陷，证明每个门禁真的会红
#   lint-python     Python 语法/格式（本仓仅剩 bringup launch 的 .py）
#   lint-c          C/C++ 格式
#   build-ros2      colcon 构建 + ros2 pkg executables + launch 解析 + colcon test
#                   （FORAY_WITH_PCL 默认 ON，因此这条作业同时守护 PCL GICP 主路径）
#   build-nopcl     -DFORAY_WITH_PCL=OFF 的构建与测试，守护内置 ICP 回退路径
#
# 更新记录：
#   - 新增 build-nopcl（决定见 decision.md D21）：FORAY_WITH_PCL=OFF 是显式的降级出口，
#     没有作业跑它就等于没人知道它还能不能编译。已踩过的教训是同类的 optional 后端
#     只在一条路径上验证，另一条直到用户遇到才坏。
#   - 新增 file-hygiene / doc-sync / param-contract / contract-lock 四个作业
#     （决定见 decision.md D18）。它们把 AGENTS.md 与 README 里原本靠人眼维持的约束变成
#     可执行断言，依据是 D15 的结论：文档漂移靠人眼 Review 抓不住，只有可执行断言能长期生效。
#     实现放在仓级 `scripts/ci/`，只用 Python 标准库，不恢复已删除的 Python 工具包。
#   - 删除 sim-smoke：探测条件写的是仓根 `foray_localization_sim`，而包在
#     `src/foray_localization_sim`（M7 迁入），求值恒为 found=false，作业自始至终
#     被跳过、从未保护过任何东西。合成仿真链路已整体移出本仓。
#   - 删除 test-python：Python 测试随 `foray_localization_tools` 一并移除，仓内已无
#     `test_*.py`；`check_param_consistency.py` 也被删除（决定见 decision.md D16）。
#     该约束已于 D18 由 `param-contract` 作业以零依赖方式恢复。
#   - dir-layout 的豁免词表只保留 `*_bringup`（装配包，无 include/ 与 test/）。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- 目录与包命名规范 ----
  # 规则与 foray_platform 一致：仓根 = colcon 空间根，全部包在 src/ 下。
  # *_bringup 是装配包，不要求 include/ 与 test/。
  dir-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验目录规范
        shell: bash
        run: |
          fail=0

          # 1) 仓根不得平铺 ROS 包
          for pkg in */package.xml; do
            [ -e "$pkg" ] || continue
            echo "::error::$(dirname "$pkg") 是包但不在 src/ 下"
            fail=1
          done

          # 2) src/ 下包名与目录名一致、不得有 tools/、工程包须有 include/ 与 test/
          for dir in src/*/; do
            [ -d "$dir" ] || continue
            name="${dir%/}"; name="${name##*/}"
            if [ ! -f "$dir/package.xml" ]; then
              echo "::error::$dir 缺少 package.xml"
              fail=1
              continue
            fi
            declared="$(sed -n 's:.*<name>[[:space:]]*\([^<]*\)[[:space:]]*</name>.*:\1:p' "$dir/package.xml" | head -1)"
            if [ "$declared" != "$name" ]; then
              echo "::error::$dir 的包名「$declared」与目录名「$name」不一致"
              fail=1
            fi
            if [ -d "$dir/tools" ]; then
              echo "::error::$dir 存在 tools/，Python 工具应放 scripts/，C++ 小工具放 apps/"
              fail=1
            fi
            case "$name" in
              *_bringup) ;;
              *)
                [ -d "$dir/include" ] || { echo "::error::$dir 缺少 include/"; fail=1; }
                [ -d "$dir/test" ]    || { echo "::error::$dir 缺少 test/"; fail=1; }
                ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "目录规范校验失败，规则见 tree.md「布局规则」「命名规则」"
            exit 1
          fi
          echo "目录规范校验通过"

  # ---- 文件卫生 ----
  # AGENTS.md「必须」里可机械判定的部分：LF · UTF-8 · 文件末尾一个空行 · 无行尾空白。
  # 缩进不在这里查：C/C++ 归 clang-format（lint-c），Python 归 ruff/black（lint-python）。
  file-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验文件卫生
        run: python3 scripts/ci/check_style.py

  # ---- tree.md 与实际跟踪文件双向一致 ----
  # 文档最常见的腐坏不是写错，而是「没跟上」：新增文件、删除目录，tree.md 悄悄过期。
  # 过期的结构说明比没有更危险——它会让下一个人照着错误的地图动手。
  doc-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tree.md 与仓库双向一致
        run: python3 scripts/ci/check_tree_doc.py

  # ---- 参数三方一致 ----
  # README「关键参数」自称「本表是实现之外的唯一参数清单」，
  # 与 declare_parameter、bringup/config/*.yaml 三处必须逐字一致。
  # D16 删掉 check_param_consistency.py 后该约束退化成 PR 人工核对，
  # 而 D15 已实证人眼抓不住这类漂移（11 个参数名错了很久无人发现）。
  param-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 README 参数表 ↔ declare_parameter ↔ 兵种配置
        run: python3 scripts/ci/check_params.py

  # ---- 契约快照 ----
  # 下游仓按 msg 字段写回调，改一个字段名可能编译期报错，也可能运行期静默错位。
  # 快照的唯一职责是让「接口变了但没人通知下游」在 PR diff 里必然可见。
  contract-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 msg/srv/action 接口指纹
        run: python3 scripts/ci/check_contracts.py

  # ---- 门禁自检 ----
  # 门禁最大的失败模式是「悄悄变成恒绿」（sim-smoke 就是先例：恒跳过却显示通过）。
  # 本作业向仓库注入 7 种已知缺陷，断言对应门禁真的会红，并断言工作区无残留。
  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 自检四道门禁
        run: python3 scripts/ci/test_guards.py

  # ---- Python 代码检查 ----
  # 本仓 Python 只剩 bringup launch 文件：仍按 pyproject.toml 的 3.10 目标检查。
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        run: ruff check .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查 ----
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 C/C++ 代码
        id: detect
        shell: bash
        run: |
          if find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 C/C++ 代码，跳过。"
          fi

      - name: Install clang-format
        if: steps.detect.outputs.found == 'true'
        run: sudo apt-get install -y clang-format

      - name: Format check
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -not -path './.git/*' -print0 | \
            xargs -0 -r clang-format --dry-run --Werror

  # ---- ROS 2 构建与测试 ----
  # 适用于 colcon 工作空间仓库。仓库内不存在 package.xml 时整个作业自动跳过。
  build-ros2:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否为 ROS 2 仓库
        id: detect
        shell: bash
        run: |
          if find . -name package.xml -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 ROS 2 package，跳过 ROS 2 构建。"
          fi

      - name: 安装依赖 (rosdep)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install -y -r --from-paths . --ignore-src --rosdistro humble

      - name: 构建 (colcon build)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: 校验可执行文件安装位置 (ros2 pkg executables)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 pkg executables foray_localization_ros | tee /tmp/exes.txt
          for exe in localization_node map_server_node; do
            grep -qx "foray_localization_ros $exe" /tmp/exes.txt \
              || { echo "::error::ros2 pkg executables 缺少 $exe（install RUNTIME 目录应为 lib/<pkg>/）"; exit 1; }
          done
          ros2 launch foray_localization_bringup localization.launch.py --show-args

      - name: 测试 (colcon test)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  # ---- 无 PCL 回退路径 ----
  # FORAY_WITH_PCL=OFF 时只编译内置 ICP 后端。这条路径是降级出口（decision.md D21），
  # 必须有人跑，否则会悄悄腐烂到用户真需要时才炸。只构建 map/ros 两包：其余包与本开关无关。
  build-nopcl:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否为 ROS 2 仓库
        id: detect
        shell: bash
        run: |
          if find . -name package.xml -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 ROS 2 package，跳过。"
          fi

      - name: 安装依赖 (rosdep)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install -y -r --from-paths . --ignore-src --rosdistro humble

      - name: 构建 (FORAY_WITH_PCL=OFF)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DFORAY_WITH_PCL=OFF

      - name: 测试 (colcon test)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
