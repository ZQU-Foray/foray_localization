# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
# 本仓已按实际技术栈裁剪：只保留**真实执行**的作业。
#
# 作业集合：
#   dir-layout   目录与包命名规范
#   lint-python  Python 语法/格式（本仓仅剩 bringup launch 的 .py）
#   lint-c       C/C++ 格式
#   build-ros2   colcon 构建 + ros2 pkg executables + launch 解析 + colcon test
#
# 更新记录：
#   - 删除 sim-smoke：探测条件写的是仓根 `foray_localization_sim`，而包在
#     `src/foray_localization_sim`（M7 迁入），求值恒为 found=false，作业自始至终
#     被跳过、从未保护过任何东西。合成仿真链路已整体移出本仓。
#   - 删除 test-python：Python 测试随 `foray_localization_tools` 一并移除，仓内已无
#     `test_*.py`；`check_param_consistency.py` 也被删除，恢复工具包时须同时恢复该作业
#     （决定见 decision.md D16）。
#   - dir-layout 的豁免词表只保留 `*_bringup`（装配包，无 include/ 与 test/）。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- 目录与包命名规范 ----
  # 规则与 foray_platform 一致：仓根 = colcon 空间根，全部包在 src/ 下。
  # *_bringup 是装配包，不要求 include/ 与 test/。
  dir-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验目录规范
        shell: bash
        run: |
          fail=0

          # 1) 仓根不得平铺 ROS 包
          for pkg in */package.xml; do
            [ -e "$pkg" ] || continue
            echo "::error::$(dirname "$pkg") 是包但不在 src/ 下"
            fail=1
          done

          # 2) src/ 下包名与目录名一致、不得有 tools/、工程包须有 include/ 与 test/
          for dir in src/*/; do
            [ -d "$dir" ] || continue
            name="${dir%/}"; name="${name##*/}"
            if [ ! -f "$dir/package.xml" ]; then
              echo "::error::$dir 缺少 package.xml"
              fail=1
              continue
            fi
            declared="$(sed -n 's:.*<name>[[:space:]]*\([^<]*\)[[:space:]]*</name>.*:\1:p' "$dir/package.xml" | head -1)"
            if [ "$declared" != "$name" ]; then
              echo "::error::$dir 的包名「$declared」与目录名「$name」不一致"
              fail=1
            fi
            if [ -d "$dir/tools" ]; then
              echo "::error::$dir 存在 tools/，Python 工具应放 scripts/，C++ 小工具放 apps/"
              fail=1
            fi
            case "$name" in
              *_bringup) ;;
              *)
                [ -d "$dir/include" ] || { echo "::error::$dir 缺少 include/"; fail=1; }
                [ -d "$dir/test" ]    || { echo "::error::$dir 缺少 test/"; fail=1; }
                ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then
            echo "目录规范校验失败，规则见 tree.md「布局规则」「命名规则」"
            exit 1
          fi
          echo "目录规范校验通过"

  # ---- Python 代码检查 ----
  # 本仓 Python 只剩 bringup launch 文件：仍按 pyproject.toml 的 3.10 目标检查。
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        run: ruff check .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查 ----
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 C/C++ 代码
        id: detect
        shell: bash
        run: |
          if find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 C/C++ 代码，跳过。"
          fi

      - name: Install clang-format
        if: steps.detect.outputs.found == 'true'
        run: sudo apt-get install -y clang-format

      - name: Format check
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -not -path './.git/*' -print0 | \
            xargs -0 -r clang-format --dry-run --Werror

  # ---- ROS 2 构建与测试 ----
  # 适用于 colcon 工作空间仓库。仓库内不存在 package.xml 时整个作业自动跳过。
  build-ros2:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否为 ROS 2 仓库
        id: detect
        shell: bash
        run: |
          if find . -name package.xml -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 ROS 2 package，跳过 ROS 2 构建。"
          fi

      - name: 安装依赖 (rosdep)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install -y -r --from-paths . --ignore-src --rosdistro humble

      - name: 构建 (colcon build)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: 校验可执行文件安装位置 (ros2 pkg executables)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          ros2 pkg executables foray_localization_ros | tee /tmp/exes.txt
          for exe in localization_node map_server_node; do
            grep -qx "foray_localization_ros $exe" /tmp/exes.txt \
              || { echo "::error::ros2 pkg executables 缺少 $exe（install RUNTIME 目录应为 lib/<pkg>/）"; exit 1; }
          done
          ros2 launch foray_localization_bringup localization.launch.py --show-args

      - name: 测试 (colcon test)
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
