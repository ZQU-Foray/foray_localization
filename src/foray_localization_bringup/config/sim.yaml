# 仿真专用参数：合成点云比 MID360 稀疏、无动态物体，阈值相应放宽。
# 实车仍用 sentry.yaml / infantry.yaml / heavy.yaml，本文件不参与默认启动。
foray_map_server:
  ros__parameters:
    publish_rate_hz: 1.0
    verify_map_hashes: true

foray_localization:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    pose_source: auto
    cloud_topic: /livox/lidar
    odom_topic: /aft_mapped_to_init
    external_pose_topic: /localization/external_pose
    state_rate_hz: 50.0
    tf_rate_hz: 20.0
    align_rate_hz: 5.0
    obstacle_rate_hz: 10.0
    voxel_leaf_m: 0.05
    map_voxel_leaf_m: 0.10
    align_max_iterations: 20
    align_max_correspondence_m: 0.80
    residual_threshold_m: 0.30
    cluster_tolerance_m: 0.30
    min_cluster_size: 5
    max_cluster_size: 500
    ok_mean_residual_m: 0.12
    degraded_mean_residual_m: 0.25
    ok_inlier_ratio: 0.35
    degraded_inlier_ratio: 0.20
    lost_timeout_sec: 1.0
    odom_timeout_sec: 0.5
    lidar_timeout_sec: 0.2
    warmup_frames: 3
    recover_frames: 3
